# /etc/aibox/aibox.conf
# System-wide defaults for aibox
# User config in ~/.config/aibox/aibox.conf overrides these.

# Network mode: none | host
network_mode=none

# Allow GPU devices by default? (true/false)
allow_gpu=false

# Default workspace if none specified (empty = current directory)
# default_workspace=/var/lib/aibox/workspaces

# Write audit logs to file?
log_to_file=true

# Keep host environment variables? (less secure, false recommended)
keep_env=false
